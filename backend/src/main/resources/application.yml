server:
  port: 8080

spring:
  application:
    name: learn-platform

  mvc:
    async:
      request-timeout: 300000   # SSE 流式问答的异步请求超时(默认 Tomcat 30s 太短)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:learn_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  ai:
    openai:
      # 生成大模型:默认 DeepSeek(OpenAI兼容协议)
      # 换通义千问: LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode  LLM_MODEL=qwen-plus
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:sk-fill-your-key}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
          temperature: 0.7
      # 嵌入模型:默认 SiliconFlow 托管的 bge-small-zh-v1.5(512维,中文效果好)
      # 换通义: EMBED_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode  EMBED_MODEL=text-embedding-v3
      embedding:
        base-url: ${EMBED_BASE_URL:https://api.siliconflow.cn}
        api-key: ${EMBED_API_KEY:sk-fill-your-key}
        options:
          model: ${EMBED_MODEL:BAAI/bge-small-zh-v1.5}
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        collection-name: learn_platform_knowledge
        initialize-schema: true   # 启动时自动创建 Collection

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印SQL,论文截图方便
  global-config:
    banner: false

# RAG 业务参数(运行时可在管理后台"知识库管理"中覆盖部分参数)
rag:
  upload-dir: ./uploads      # 课件文件存储目录
  chunk-size: 500            # 递归字符分块:每块目标字符数
  chunk-overlap: 50          # 相邻块重叠字符数
  embed-batch-size: 16       # 向量嵌入批量大小
  default-top-k: 5           # 默认召回数量
  default-threshold: 0.5     # 默认相似度阈值
  ocr-base-url: ${OCR_BASE_URL:}          # OCR服务地址(如 http://localhost:9000/ocr),为空关闭OCR
  ocr-max-pages: 30          # OCR 最大识别页数
  rerank-base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn}  # 重排服务(兼容 /v1/rerank)
  rerank-model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}           # 重排模型
  rerank-api-key: ${RERANK_API_KEY:}      # 重排 Key,为空则重排关闭(可复用 EMBED_API_KEY)
  jwt-secret: rag-edu-graduation-project-jwt-secret-please-change-in-prod
  jwt-expire-hours: 72

logging:
  level:
    org.springframework.ai: INFO

# 知识资讯:系统每天早上 9:00 自动抓取公开资讯源(RSS/Atom)入库,
# 强制标注来源(source_name/source_url),仅作学习导航,如若侵权可联系删除。
news:
  fetch-cron: ${NEWS_FETCH_CRON:0 0 9 * * ?}
  # 每项格式:来源名|分类|RSS地址,英文逗号分隔;可用环境变量 NEWS_RSS_FEEDS 整体覆盖
  rss-feeds: ${NEWS_RSS_FEEDS:知乎每日精选|综合|https://www.zhihu.com/rss,Solidot|科技|https://www.solidot.org/index.rss,少数派|数字生活|https://sspai.com/feed,36氪|商业科技|https://36kr.com/feed,阮一峰的网络日志|科技|https://www.ruanyifeng.com/blog/atom.xml}
