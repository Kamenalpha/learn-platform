# 毕设开发环境依赖:MySQL 8 + Redis 7 + Chroma 向量数据库
# 使用方式:先安装 Docker Desktop,然后在项目根目录执行 docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: rag_edu
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro   # 首次启动自动执行 sql/init.sql 建表

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  chroma:
    image: ghcr.io/chroma-core/chroma:1.0.0
    container_name: rag-chroma
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data

volumes:
  mysql-data:
  redis-data:
  chroma-data:
