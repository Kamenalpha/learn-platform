# 一键部署:MySQL 8 + Redis 7 + Chroma + Spring Boot 后端(前端另行 npm run dev 或静态部署)
# 使用方式:
#   1. 安装 Docker Desktop,复制 .env.example 为 .env 并填入 API Key
#   2. 项目根目录执行: docker compose up -d --build
#   3. 后端就绪后访问 http://localhost:8080(默认账号 admin/admin123、student/123456)
services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123456}
      MYSQL_DATABASE: learn_platform        # 与 init_learning.sql 建库名保持一致
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动(空数据卷)按文件名字母序执行 sql/*.sql:
      # init.sql(旧版遗留,会多建一个不用的 rag_edu 库) → init_learning.sql(learn_platform 34 张表) → upgrade_*.sql(增量)
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  chroma:
    image: ghcr.io/chroma-core/chroma:1.0.0
    container_name: rag-chroma
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      # chroma 1.0.0 为 Rust 二进制镜像,无 python/curl/wget,用 bash /dev/tcp 发原始 HTTP 请求探测 heartbeat
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    container_name: rag-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: learn_platform
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      REDIS_HOST: redis
      CHROMA_HOST: http://chroma
      CHROMA_PORT: 8000
      LLM_API_KEY: ${LLM_API_KEY:?请先复制 .env.example 为 .env 并填写 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBED_API_KEY: ${EMBED_API_KEY:?请先复制 .env.example 为 .env 并填写 EMBED_API_KEY}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-https://api.siliconflow.cn}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-zh-v1.5}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-rag-edu-graduation-project-jwt-secret-please-change-in-prod}
      # 允许跨域的前端来源(逗号分隔);对外部署设为可信域名,勿留默认 *
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      QUOTA_ENABLED: ${QUOTA_ENABLED:-true}
      QUOTA_CHAT_LIMIT: ${QUOTA_CHAT_LIMIT:-200}
      QUOTA_GENERATE_LIMIT: ${QUOTA_GENERATE_LIMIT:-30}
      QUOTA_GRADE_LIMIT: ${QUOTA_GRADE_LIMIT:-200}
      QUOTA_PROJECT_LIMIT: ${QUOTA_PROJECT_LIMIT:-10}
      QUOTA_GRAPH_LIMIT: ${QUOTA_GRAPH_LIMIT:-30}
      NEWS_FETCH_CRON: ${NEWS_FETCH_CRON:-0 0 9 * * ?}
      # 默认值兜底须与 application.yml news.rss-feeds 保持一致(空串会导致 Spring 占位符不回退默认源)
      NEWS_RSS_FEEDS: ${NEWS_RSS_FEEDS:-知乎每日精选|综合|https://www.zhihu.com/rss,Solidot|科技|https://www.solidot.org/index.rss,少数派|数字生活|https://sspai.com/feed,36氪|商业科技|https://36kr.com/feed,阮一峰的网络日志|科技|https://www.ruanyifeng.com/blog/atom.xml}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads   # 上传课件持久化(对应 application.yml 的 ./uploads)

volumes:
  mysql-data:
  redis-data:
  chroma-data:
  backend-uploads:
